name: Validate, QA, and deploy Pages
on:
  push:
    branches: [main, work, codex/spritelab-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/check_frontend.py
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Browser QA with system Chrome
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-editor-playwright-artifacts
          path: |
            test-results/screenshots
            test-results/**/*.zip
          if-no-files-found: warn
      - name: Assemble dependency-free Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html styles.css README.md _site/
          cp -R src vendor docs _site/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: _site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
