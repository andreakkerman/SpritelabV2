name: Validate, QA, and deploy Pages
on:
  push:
    branches: [main, codex/spritelab-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned Atlas source frames
        run: bash tools/setup_atlas_assets.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate analysis and binary preview assets
        run: python tools/analyze_sven.py
      - run: python tools/analyze_sven.py --check
      - run: python tools/check_frontend.py
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node --check app.js
      - name: Browser QA with system Chrome
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-screenshots, path: test-results/screenshots, if-no-files-found: warn }
      - name: Assemble complete static Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/inputs/sven/walk _site/outputs
          cp index.html app.js styles.css _site/
          cp -R inputs/sven/walk/atlas-original _site/inputs/sven/walk/
          cp -R outputs/analysis outputs/previews _site/outputs/
          sed -i "s/>local</>${GITHUB_SHA::7}</" _site/index.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: _site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
