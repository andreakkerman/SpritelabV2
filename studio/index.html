<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#111719">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>SpriteLab · Studio</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body data-mode="asset">
  <header>
    <a class="brand" href="../"><b>SPRITE<span>LAB</span></b><small>STUDIO</small></a>
    <nav aria-label="Editor mode"><button id="assetMode" class="active">Asset</button><button id="frameMode">Frame</button></nav>
    <div id="saveState">Local-first</div>
  </header>

  <input id="masterInput" class="visually-hidden" type="file" accept="image/png">
  <div class="toolbar" aria-label="Project actions">
    <label id="importLabel" class="file primary" for="masterInput">Open master image</label>
    <button id="fit">Fit</button><button id="undo">Undo</button><button id="redo">Redo</button>
    <details class="more-menu"><summary>More</summary><div class="more-menu-panel">
      <button id="toggleMaster">Master: on</button><button id="rawMaster">Mask: applied</button>
      <button id="removeBackground">Remove edge background</button>
      <label>Overlay <input id="masterOpacity" type="range" min="0" max="100" value="100"></label>
      <button id="save">Save project</button><button id="export">Export ZIP</button><a href="../">Animator ↗</a>
    </div></details>
  </div>

  <main>
    <aside class="tools" aria-label="Canvas tools">
      <button data-tool="select" class="active">▱<span>Select</span></button><button data-tool="polygon">⬠<span>Polygon</span></button>
      <button data-tool="move">✥<span>Move</span></button><button data-tool="pivot">⊙<span>Pivot</span></button>
      <button data-tool="erase">◯<span>Erase</span></button><button data-tool="restore">●<span>Restore</span></button>
      <button data-tool="pan">✋<span>Pan</span></button>
    </aside>
    <section class="workspace">
      <div class="canvasbar"><span id="dimensions">No master</span><span id="zoom">100%</span><span id="modeLabel">ASSET MODE</span></div>
      <div id="viewport">
        <canvas id="canvas"></canvas>
        <div id="empty">
          <b>Open a master image</b><span>Choose the character image you want to edit.</span>
          <label class="file primary" for="masterInput">Open master image</label>
        </div>
        <div id="onboardingHint" hidden>Use Select to mark a body part, then choose its role and extract it.</div>
      </div>
      <div id="selectionActions" hidden>
        <select id="role" aria-label="Cutout role"><option>upper_body</option><option>pelvis_cover</option><option>left_leg</option><option>right_leg</option></select>
        <button id="extract" class="primary">Extract cutout</button><button id="closePolygon" hidden>Close polygon</button><button id="cancelSelection">Cancel</button>
      </div>
    </section>
    <button id="inspectorToggle" aria-expanded="false" aria-controls="inspectorPanel">Assets</button>
    <div id="inspectorBackdrop" hidden></div>
    <aside class="inspector" id="inspectorPanel" aria-label="Assets and properties">
      <div class="sheet-head"><strong>Assets &amp; properties</strong><button id="inspectorClose" aria-label="Close inspector">Close</button></div>
      <section><h2>Rig assets</h2><div id="assets"></div></section>
      <section id="properties"><h2>Properties</h2><p class="muted">Select an extracted asset.</p></section>
      <section><h2>Seam QA</h2><label>Leg test <input id="legAngle" type="range" min="-20" max="20" value="0"><output id="legAngleValue">0°</output></label><button id="recompose">Preview recomposition</button><ul id="warnings"></ul></section>
    </aside>
  </main>

  <footer>
    <div class="transport"><button id="previous">◀</button><button id="play" class="primary">▶</button><button id="next">▶</button><button id="newFrame">+ Empty</button><button id="duplicate">Duplicate</button><button id="deleteFrame">Delete</button><label>FPS <input id="fps" type="number" min="1" max="30" value="10"></label><label><input id="onionPrev" type="checkbox"> Prev</label><label><input id="onionNext" type="checkbox"> Next</label><label>Onion <input id="onionOpacity" type="range" min="5" max="70" value="25"></label><button id="copyRegion">Copy region</button><button id="pastePatch">Paste in place</button></div>
    <div id="timeline"></div>
  </footer>
  <div id="toast" role="status"></div>
  <script src="../vendor/jszip.min.js"></script><script type="module" src="app.js"></script>
</body>
</html>
