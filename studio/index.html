<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><meta name="theme-color" content="#111719"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><title>SpriteLab · Studio</title><link rel="stylesheet" href="studio.css"></head><body>
<header><a class="brand" href="../"><b>SPRITE<span>LAB</span></b><small>STUDIO</small></a><nav><button id="assetMode" class="active">Asset mode</button><button id="frameMode">Frame mode</button></nav><div id="saveState">Local-first</div></header>
<div class="toolbar"><label class="file primary">Import master PNG<input id="masterInput" type="file" accept="image/png"></label><button id="fit">Fit</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="toggleMaster">Master: on</button><button id="rawMaster">Mask: applied</button><button id="removeBackground">Remove edge background</button><label>Overlay <input id="masterOpacity" type="range" min="0" max="100" value="100"></label><button id="save">Save project</button><button id="export">Export ZIP</button><a href="../">Animator ↗</a></div>
<main><aside class="tools" aria-label="Tools"><button data-tool="select" class="active">▱<span>Select</span></button><button data-tool="polygon">⬠<span>Polygon</span></button><button data-tool="move">✥<span>Move</span></button><button data-tool="pivot">⊙<span>Pivot</span></button><button data-tool="erase">◯<span>Mask erase</span></button><button data-tool="restore">●<span>Mask restore</span></button><button data-tool="pan">✋<span>Pan</span></button></aside>
<section class="workspace"><div class="canvasbar"><span id="dimensions">No master</span><span id="zoom">100%</span><span id="modeLabel">ASSET MODE</span></div><div id="viewport"><canvas id="canvas"></canvas><div id="empty"><b>Import a master PNG</b><span>The original stays immutable and local.</span></div></div><div id="selectionActions" hidden><select id="role"><option>upper_body</option><option>pelvis_cover</option><option>left_leg</option><option>right_leg</option></select><button id="extract" class="primary">Extract cutout</button><button id="closePolygon">Close polygon</button><button id="cancelSelection">Cancel</button></div></section>
<button id="inspectorToggle" aria-expanded="false">Assets & properties</button><aside class="inspector" id="inspectorPanel"><section><h2>Rig assets</h2><div id="assets"></div></section><section id="properties"><h2>Properties</h2><p class="muted">Select an extracted asset.</p></section><section><h2>Seam QA</h2><label>Leg test <input id="legAngle" type="range" min="-20" max="20" value="0"><output id="legAngleValue">0°</output></label><button id="recompose">Preview recomposition</button><ul id="warnings"></ul></section></aside>
</main><footer><div class="transport"><button id="previous">◀</button><button id="play" class="primary">▶</button><button id="next">▶</button><button id="newFrame">+ Empty</button><button id="duplicate">Duplicate</button><button id="deleteFrame">Delete</button><label>FPS <input id="fps" type="number" min="1" max="30" value="10"></label><label><input id="onionPrev" type="checkbox"> Prev</label><label><input id="onionNext" type="checkbox"> Next</label><label>Onion <input id="onionOpacity" type="range" min="5" max="70" value="25"></label><button id="copyRegion">Copy region</button><button id="pastePatch">Paste in place</button></div><div id="timeline"></div></footer><div id="toast" role="status"></div>
<script src="../vendor/jszip.min.js"></script><script type="module" src="app.js"></script></body></html>
